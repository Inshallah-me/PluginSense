name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild PluginSense.sln -p:Configuration=Release -p:Platform=x64 -m

      - name: Upload PluginSense.dll
        uses: actions/upload-artifact@v4
        with:
          name: PluginSense-dll
          path: bin\x64\Release\PluginSense.dll
